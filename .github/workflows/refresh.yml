name: Refresh AR aging dashboard

on:
  schedule:
    # Weekdays at ~6:05 PM Central. GitHub schedules run in UTC, so two triggers cover
    # daylight time (23:05 UTC) and standard time (00:05 UTC); the extra run is harmless.
    - cron: "5 23 * * 1-5"
    - cron: "5 0 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site folder
        run: |
          mkdir -p site
          cp index.html logo.png site/

      - name: Build encrypted AR snapshot (live Sage feed, or stored snapshot until Sage is connected)
        env:
          SAGE_CLIENT_ID: ${{ secrets.SAGE_CLIENT_ID }}
          SAGE_CLIENT_SECRET: ${{ secrets.SAGE_CLIENT_SECRET }}
          SAGE_USERNAME: ${{ secrets.SAGE_USERNAME }}
          SEED_KEY: ${{ secrets.SEED_KEY }}
          CUSTOMER_DIVISIONS: ${{ secrets.CUSTOMER_DIVISIONS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          COMPANY_NAME: GFS Logistics
        run: python fetch_ar.py --out site/data.enc.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
