name: Refresh AR aging dashboard

on:
  schedule:
    # Hourly at :05 past, 7 AM–6 PM Central (UTC 12–23 during CDT; shifts 1 hr in winter), Mon–Fri.
    - cron: "5 12-23 * * 1-5"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull open AR from Sage Intacct and encrypt
        env:
          SAGE_CLIENT_ID: ${{ secrets.SAGE_CLIENT_ID }}
          SAGE_CLIENT_SECRET: ${{ secrets.SAGE_CLIENT_SECRET }}
          SAGE_USERNAME: ${{ secrets.SAGE_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          COMPANY_NAME: GFS Logistics
        run: |
          if [ -z "$SAGE_CLIENT_ID" ]; then
            echo "::warning::Sage secrets not set yet - deploying SAMPLE data"
            python scripts/fetch_ar.py --sample --out site/data.enc.json
          else
            python scripts/fetch_ar.py --out site/data.enc.json
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
